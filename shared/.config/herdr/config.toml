onboarding = false

[terminal]
# "follow" (herdr's default) makes new panes and tabs inherit the focused
# pane's directory — the pre-0.8.0 / tmux behavior. new_cwd is a single global
# policy covering panes, tabs AND spaces with no per-context override, so the
# ~/development default for new spaces is applied by the wrapped new_workspace
# binding below instead (an explicit --cwd outranks new_cwd).
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+s"

# Pane navigation — Alt+hjkl (matches tmux-tilish / vim-tmux-navigator)
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

# Pane cycling — Alt+`/~ (matches tmux)
cycle_pane_next = "alt+backtick"
cycle_pane_previous = "alt+shift+backtick"

# Rename pane — prefix+p (default prefix+shift+p is left unbound)
rename_pane = "prefix+p"

# Tab switching — Alt+1-9 (matches tmux-tilish window switching)
switch_tab = "alt+1..9"

# Tab navigation — prefix+[/]
previous_tab = "prefix+["
next_tab = "prefix+]"

# Copy mode — prefix+v (matches tmux; default prefix+[ conflicts with previous_tab)
copy_mode = "prefix+v"

# New tab — Alt+n (matches tmux new-window)
new_tab = "prefix+n"

# Agent navigation — Alt+Shift+[/]
previous_agent = "alt+shift+["
next_agent = "alt+shift+]"
focus_agent = "prefix+1..9"

# Goto — prefix+o (jump prompt listing workspaces/spaces and agents to switch to;
# moved from default prefix+g, which is now free)
goto = "prefix+o"
# Workspace picker disabled — default prefix+w conflicts with open_worktree, and
# prefix+o is used for goto instead
workspace_picker = ""
# Rename workspace disabled — its default prefix+shift+w is the repo worktree
# picker below (prefix+shift+e is the Editor popup)
rename_workspace = ""
# open_notification_target disabled — no free slot
open_notification_target = ""
# new_workspace disabled as a native binding — replaced by the [[keys.command]]
# wrapper below (prefix+shift+n) that passes --cwd ~/development, since
# [terminal] new_cwd is now "follow" for the sake of panes/tabs
new_workspace = ""
previous_workspace = "alt+["
next_workspace = "alt+]"
switch_workspace = "alt+shift+1..9"

# Split panes (matches tmux)
split_horizontal = "prefix+\\"
split_vertical = "prefix+|"

# Zoom — Alt+z
zoom = "alt+z"

# Native worktree actions disabled — prefix+w (all worktrees), prefix+shift+w
# (find-or-create in this repo) and prefix+shift+d (remove) run the worktree
# pickers instead (scripts/wt-picker.sh, built on Worktrunk +
# shared/bin/herdr-wt; [[keys.command]] entries below). They add setup hooks,
# a match list while typing, a cross-repo list, and delete from the list.
# There's no separate "new worktree" key: the repo picker's Enter / ctrl-n
# already create. prefix+shift+b is the branch picker (existing branch -> worktree).
open_worktree = ""
new_worktree = ""
remove_worktree = ""

# New space — prefix+shift+n, wrapped to force ~/development.
#
# [terminal] new_cwd is "follow" so that splits and new tabs inherit the
# focused pane (herdr 0.8.0 collapsed panes/tabs/spaces under one global
# policy). New *spaces* should still start in ~/development, so this wrapper
# passes an explicit --cwd, which outranks new_cwd. See TROUBLESHOOTING.md.
[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = "bash -lc 'herdr workspace create --focus --cwd ~/development'"
description = "New space"

# Quick shell — exits automatically after a successful command
# (double Ctrl-c within 2s also closes the popup)
[[keys.command]]
key = "prefix+c"
type = "popup"
command = "bash -lc ~/.config/herdr/scripts/quick-shell.sh"
description = "Quick shell"

# Mini shell — persists until explicitly closed
# (double Ctrl-c within 2s closes the popup)
[[keys.command]]
key = "prefix+C"
type = "popup"
command = "bash -lc '~/.config/herdr/scripts/quick-shell.sh --persist'"
description = "Mini shell"

# Editor — $EDITOR in a popup (matches tmux's bind-key E in conf.d/50-apps.conf)
[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = "bash -lc '$EDITOR'"
description = "Editor"
width = 100
height = 50

# Lazygit (uses lazygit-launch to pick up profile-specific overlays, e.g.
# config-remote-sandbox.yml's autoFetch: false on remote-sandbox/crafting boxes)
[[keys.command]]
key = "prefix+G"
type = "popup"
command = "bash -lc lazygit-launch"
description = "Lazygit"
width = "95%"
height = "90%"

# Yazi file manager — prefix+shift+y
[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "bash -lc yazi"
description = "Yazi file manager"
width = "80%"
height = "80%"

# pj project picker — prefix+shift+o (pj-herdr plugin). Matches the Herdr Mac app,
# where leader O opens its pj-picker mod (see shared/.config/herdr-app/README.md, "TUI ↔ app parity")
[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "pj.open-picker"
description = "Project picker (pj)"

# All worktrees (scripts/wt-picker.sh --all) — every managed worktree
# (~/.herdr/worktrees/<repo>/<name>) across all repos, from any pane. Enter
# focuses its open workspace or opens one; ctrl-d offers to delete it, ctrl-g to
# merge it into the default branch (`wt merge`). No
# create (use prefix+shift+w in the repo). Main checkouts: the pj picker.
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "bash -lc '~/.config/herdr/scripts/wt-picker.sh --all'"
description = "All worktrees"
width = "80%"
height = "60%"

# Worktree picker for this repo (scripts/wt-picker.sh) — type a name; matching
# worktrees of the focused pane's repo are listed below. Enter focuses an open
# one, opens a closed one, or creates the typed name when nothing matches (from
# a freshly fetched origin/<default>, running the Worktrunk hooks in
# ~/.config/worktrunk/config.toml). ctrl-n creates the typed name even if
# something matches; ctrl-d offers to delete the highlighted worktree; ctrl-g
# offers to merge it into the default branch (`wt merge`: squash, rebase,
# fast-forward, remove worktree and branch, close its workspace).
# Same keys in the Herdr Mac app (leader w / W / D, mods/wt-picker).
[[keys.command]]
key = "prefix+shift+w"
type = "popup"
command = "bash -lc ~/.config/herdr/scripts/wt-picker.sh"
description = "Worktree picker (this repo)"
width = "80%"
height = "60%"

# Branch picker (scripts/wt-picker.sh --branch) — the focused pane's repo's
# local and origin branches that have no worktree yet, newest first. Enter checks
# the branch out as a worktree (remote-only ones get a tracking branch, Worktrunk
# hooks run) and opens its workspace. Refs are whatever is already local (no
# fetch). Same keys in the Herdr Mac app (leader B, mods/wt-picker mode "branch").
[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "bash -lc '~/.config/herdr/scripts/wt-picker.sh --branch'"
description = "Branch picker (worktree from branch)"
width = "80%"
height = "60%"

# Remove the focused pane's worktree — confirm (forced if dirty), delete the
# checkout with `wt remove` (branch too if merged), close its workspace.
# Refuses the main checkout.
[[keys.command]]
key = "prefix+shift+d"
type = "popup"
command = "bash -lc '~/.config/herdr/scripts/wt-picker.sh --remove-current'"
description = "Remove worktree"
width = "70%"
height = "40%"

# herdr-plugin-gh-pr (https://github.com/wyattjoh/herdr-plugin-gh-pr)
# Open focused pane's branch PR in the browser — prefix+g (default goto freed;
# goto lives at prefix+o instead)
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "gh-pr.open-pr"
description = "Open PR in browser"

# Manually refresh PR status for the focused pane's branch — prefix+u
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "gh-pr.refresh"
description = "Refresh PR status"


[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

# Wider than herdr's defaults (26/18/36) — default was too narrow on startup
sidebar_width = 40
sidebar_min_width = 24
sidebar_max_width = 55

agent_panel_sort = "priority"
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab", "pane"],
  [{ token = "$repo", fg = "#bb9af7" }, { token = "$branch", fg = "#7dcfff" }, { token = "$pr", fg = "#9ece6a" }],
  ["terminal_title_stripped"]
]

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
